version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: intellistream-postgres
    restart: always
    environment:
      POSTGRES_DB: intellistreamdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
      timeout: 5s


  fastapi:
    build:
      context: ./backend-fastapi
    container_name: intellistream-fastapi
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@intellistream-postgres:5432/intellistream_auth

  frontend:
    build:
      context: ./frontend
    container_name: intellistream-frontend
    depends_on:
      - fastapi
    ports:
      - "3000:80"
